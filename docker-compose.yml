services:
  realm-web-manager:
    build: .
    container_name: realm-web-manager
    restart: unless-stopped
    network_mode: host
    environment:
      HOST: "0.0.0.0"
      PORT: "18765"
      REALM_SESSION_SECRET: "${REALM_SESSION_SECRET}"
      REALM_RUNTIME: "docker"
    volumes:
      - realm-data:/data

volumes:
  realm-data:
