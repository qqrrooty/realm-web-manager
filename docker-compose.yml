services:
  realm-web-manager:
    build: .
    container_name: realm-web-manager
    restart: unless-stopped
    network_mode: host
    environment:
      HOST: "0.0.0.0"
      PORT: "18765"
      REALM_SESSION_SECRET: "${REALM_SESSION_SECRET}"
      WEB_BASE_PATH: "${WEB_BASE_PATH:-}"
      REALM_RUNTIME: "docker"
    volumes:
      - realm-data:/data
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  realm-data:
